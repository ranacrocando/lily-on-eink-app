<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lily-on-eink</title>
  </head>
  <body>
    <main id="app">
      <h1>lily-on-eink</h1>
      <p>Turn your LilyPond sheet music into PDFs that fit your e-reader. Everything happens in your browser.</p>
      <section id="engine-status" aria-live="polite">
        <p id="engine-text">Loading the music engine (30 MB, once)…</p>
        <progress id="engine-progress"></progress>
      </section>
      <section aria-labelledby="files-heading">
        <h2 id="files-heading">1. Your files</h2>
        <div id="drop-zone" class="drop-zone">
          <p>Drop your LilyPond files (.ly, .ily) or a whole folder here.</p>
          <div class="buttons">
            <button id="choose-files" type="button">Choose files</button>
            <button id="choose-folder" type="button">Choose a folder</button>
          </div>
        </div>
        <input id="file-input" type="file" multiple accept=".ly,.ily" hidden />
        <input id="folder-input" type="file" webkitdirectory hidden />
        <div id="project-summary" aria-live="polite"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
