# Dependency updates: monthly, grouped to keep PR noise low.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      # The LilyPond engine changes layouts: always its own PR, reviewed against visual snapshots.
      lilypond-engine:
        patterns: ["@sightread/lilypond-wasm"]
      npm-minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["@sightread/lilypond-wasm"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
