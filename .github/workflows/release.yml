name: Release
# A published app release gets the corresponding source of the bundled engine attached (GPLv3 section 6(d)) and is
# then deployed to GitHub Pages. Manual runs redo both for an existing release.
#
# Needs no core checkout: npm ci installs core and engine-wasm from their release tarballs (package-lock.json).
# node_modules/@lily-on-eink/core/package.json must stay installed: its version goes into the About page links and
# into README-SOURCE.txt.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the source to and deploy, e.g. v0.1.0
        required: true
        type: string
permissions: {}
env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' is not vX.Y.Z"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Check that the tag matches the app version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Look for the source asset
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="lily-on-eink-engine-source-$(node -p 'require("./node_modules/@sightread/lilypond-wasm/package.json").version').tar"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if grep -qxF "$name" <<< "$assets"; then
            echo "$name is already attached to $TAG; keeping it"
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect the engine source
        if: steps.asset.outputs.missing == 'true'
        run: node scripts/collect-engine-source.mjs "$RUNNER_TEMP/engine-source"
      - name: Attach it to the release
        if: steps.asset.outputs.missing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.asset.outputs.name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/engine-source/$NAME" --repo "$GITHUB_REPOSITORY"

  deploy:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build
        env:
          APP_BASE: /lily-on-eink-app/
          VITE_APP_VERSION: ${{ env.TAG }}
        run: |
          npm ci
          npm run build
          node scripts/check-build.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - uses: actions/deploy-pages@v5
        id: deployment
